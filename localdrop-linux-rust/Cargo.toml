[package]
name = "localdrop-linux-rust"
version = "0.1.0"
edition = "2021"
description = "Cliente Linux Rust compatible con LocalDrop"
license = "MIT"

[dependencies]
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem", "sha256"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
eframe = { version = "0.29", features = ["default_fonts", "glow"] }
rfd = "0.15"
qrcode = "0.14"

[dev-dependencies]
tempfile = "3"
