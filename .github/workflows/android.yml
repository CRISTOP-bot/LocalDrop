name: Android CI and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: gradle clean test assembleDebug lint --stacktrace
      - name: Build Linux C++ client
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev
          cmake -S desktop-cpp -B desktop-cpp/build
          cmake --build desktop-cpp/build --parallel
      - name: Prepare release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LocalDrop-debug.apk
          sha256sum LocalDrop-debug.apk > LocalDrop-debug.apk.sha256
      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: LocalDrop v0.1.${{ github.run_number }}
          generate_release_notes: true
          prerelease: true
          files: |
            LocalDrop-debug.apk
            LocalDrop-debug.apk.sha256
